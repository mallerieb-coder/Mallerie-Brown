<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plumbing Supply Manager</title>

<style>
:root{
  --purple:#7b4fe0;
  --purple-light:#efe8ff;
  --bg:#f7f7fb;
  --card:#ffffff;
  --text:#17171c;
  --muted:#72727d;
  --line:#e7e6ed;
  --green:#2cac6d;
  --green-light:#e7f8ef;
  --orange:#c88c20;
  --orange-light:#fff3db;
  --red:#d64e4e;
  --shadow:0 5px 20px rgba(0,0,0,.06);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding-bottom:90px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px;
  background:rgba(247,247,251,.96);
  border-bottom:1px solid var(--line);
}

.topbar h1{
  margin:0;
  font-size:21px;
  flex:1;
}

.icon-button{
  border:0;
  background:transparent;
  width:40px;
  height:40px;
  font-size:22px;
  border-radius:12px;
}

main{
  padding:14px;
}

.hidden{
  display:none !important;
}

.search{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px 14px;
  margin-bottom:14px;
  background:white;
  outline:none;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.card{
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  box-shadow:var(--shadow);
}

.home-card{
  min-height:110px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.home-card .icon{
  font-size:27px;
}

.home-card strong{
  font-size:16px;
}

.home-card.create{
  background:var(--purple);
  color:white;
  border-color:var(--purple);
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.section-title h2{
  margin:0;
  font-size:20px;
}

.list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.row{
  background:white;
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:var(--shadow);
}

.row.clickable{
  cursor:pointer;
}

.row-main{
  flex:1;
}

.row-title{
  font-weight:800;
  margin-bottom:4px;
}

.row-sub{
  font-size:13px;
  color:var(--muted);
}

.badge{
  padding:6px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}

.badge.green{
  color:#18854f;
  background:var(--green-light);
}

.badge.purple{
  color:#6039c7;
  background:var(--purple-light);
}

.badge.orange{
  color:#9a6b12;
  background:var(--orange-light);
}

.btn{
  border:0;
  border-radius:13px;
  padding:12px 15px;
  font-weight:800;
  background:#ececf2;
  color:#292932;
}

.btn.purple{
  background:var(--purple);
  color:white;
}

.btn.soft{
  background:var(--purple-light);
  color:#6039c7;
}

.btn.green{
  background:var(--green);
  color:white;
}

.btn.red{
  background:var(--red);
  color:white;
}

.btn.full{
  width:100%;
}

.btn.small{
  padding:8px 11px;
  font-size:13px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:6px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:13px;
  background:white;
  outline:none;
}

.field textarea{
  min-height:90px;
}

.info-box{
  background:white;
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
}

.info-label{
  font-size:12px;
  color:var(--muted);
}

.info-value{
  font-weight:800;
  margin-top:4px;
}

.qr{
  width:150px;
  height:150px;
  margin:15px auto;
  border:10px solid white;
  box-shadow:0 0 0 2px var(--line);
  background:
    linear-gradient(90deg,#111 12px,transparent 12px) 0 0/30px 30px,
    linear-gradient(#111 12px,transparent 12px) 0 0/30px 30px,
    linear-gradient(90deg,transparent 15px,#111 15px,#111 24px,transparent 24px) 0 0/30px 30px,
    linear-gradient(transparent 15px,#111 15px,#111 24px,transparent 24px) 0 0/30px 30px;
}

.qr-label{
  text-align:center;
  font-size:32px;
  font-weight:900;
}

.two-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  background:white;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  z-index:40;
}

.nav{
  border:0;
  background:transparent;
  font-size:11px;
  color:#666674;
  padding:5px;
}

.nav span{
  display:block;
  font-size:20px;
}

.nav.active{
  color:var(--purple);
  font-weight:900;
}

.drawer{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
}

.drawer.open{
  display:block;
}

.drawer-shade{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.28);
}

.drawer-panel{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:min(350px,86vw);
  background:white;
  padding:20px 15px;
}

.drawer-title{
  font-size:22px;
  font-weight:900;
  margin:12px 8px 22px;
}

.menu-item{
  padding:14px;
  border-radius:13px;
  font-weight:750;
}

.menu-item:active{
  background:var(--purple-light);
}

.modal{
  position:fixed;
  inset:0;
  display:none;
  z-index:200;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.open{
  display:flex;
}

.modal-bg{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.42);
}

.modal-card{
  position:relative;
  width:100%;
  max-width:430px;
  background:white;
  border-radius:22px;
  padding:20px;
}

.modal-card h2{
  margin-top:0;
}

.order-sheet table{
  width:100%;
  border-collapse:collapse;
}

.order-sheet th{
  font-size:12px;
  text-align:left;
  color:var(--muted);
  padding:8px 4px;
}

.order-sheet td{
  border-top:1px solid var(--line);
  padding:7px 4px;
}

.order-sheet input{
  width:100%;
  border:0;
  outline:none;
  background:transparent;
}

.scan-box{
  height:330px;
  border-radius:20px;
  background:#222;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:20px;
}

.scan-frame{
  width:180px;
  height:180px;
  border:4px solid #a77cff;
  border-radius:20px;
  margin-bottom:20px;
}

.center{
  text-align:center;
}

.space{
  height:10px;
}
</style>
</head>

<body>

<div class="app">

  <header class="topbar">
    <button class="icon-button" onclick="openMenu()">☰</button>
    <h1 id="pageTitle">Plumbing Supply Manager</h1>
    <button class="icon-button">🔔</button>
  </header>

  <main id="content"></main>

</div>

<div class="bottom-nav">
  <button class="nav active" onclick="showHome(this)">
    <span>⌂</span>Home
  </button>

  <button class="nav" onclick="showMyOrders(this)">
    <span>▣</span>My Orders
  </button>

  <button class="nav" onclick="showScan(this)">
    <span>◎</span>Scan
  </button>

  <button class="nav" onclick="showReminders(this)">
    <span>🔔</span>Reminders
  </button>

  <button class="nav" onclick="openMenu()">
    <span>☰</span>More
  </button>
</div>

<div id="drawer" class="drawer">
  <div class="drawer-shade" onclick="closeMenu()"></div>

  <div class="drawer-panel">
    <div class="drawer-title">Plumbing Supply Manager</div>

    <div class="menu-item" onclick="showHome();closeMenu()">⌂ Home</div>
    <div class="menu-item" onclick="showMyOrders();closeMenu()">▣ My Orders</div>
    <div class="menu-item" onclick="showQuotes();closeMenu()">▤ Quotes</div>
    <div class="menu-item" onclick="showCustomers();closeMenu()">👥 Customers</div>
    <div class="menu-item" onclick="showCreateOrder();closeMenu()">＋ Create Order</div>
    <div class="menu-item" onclick="showInvoices();closeMenu()">▧ Invoices</div>
    <div class="menu-item" onclick="showReminders();closeMenu()">🔔 Reminders</div>

    <div class="menu-item"
         onclick="showShelves();closeMenu()"
         style="background:var(--purple-light);color:#6039c7;">
      ▦ Shelf Locations
    </div>

    <div class="menu-item" onclick="showCompleted();closeMenu()">✓ Completed Orders</div>
    <div class="menu-item">👤 Team Members</div>
    <div class="menu-item">⚙ Settings</div>
  </div>
</div>

<div id="modal" class="modal">
  <div class="modal-bg" onclick="closeModal()"></div>
  <div id="modalContent" class="modal-card"></div>
</div>

<script>

let shelves = [
  {
    code:"A1",
    description:"Front Wall - Top Shelf",
    orders:["Cross Roads"]
  },
  {
    code:"A2",
    description:"Front Wall - Middle Shelf",
    orders:["K Knutson"]
  },
  {
    code:"A3",
    description:"Front Wall - Bottom Shelf",
    orders:[]
  },
  {
    code:"B1",
    description:"Back Wall - Top Shelf",
    orders:["Johnson"]
  },
  {
    code:"B2",
    description:"Back Wall - Middle Shelf",
    orders:[]
  },
  {
    code:"B3",
    description:"Back Wall - Bottom Shelf",
    orders:[]
  },
  {
    code:"D4",
    description:"Back Wall - Lower Shelf",
    orders:["306 Preserve"]
  }
];

let completedOrders = [];

let companies = {
  "D Star Plumbing":[
    "306 Preserve",
    "Cross Roads",
    "K Knutson",
    "Johnson"
  ],

  "Ridgeline Plumbing":[
    "Highland"
  ],

  "Durant / Slate":[
    "Harvest Fields"
  ],

  "Goff Plumbing":[
    "Stalker Farms"
  ],

  "Cable Plumbing":[]
};

let homeowners = [
  "Ryan",
  "Johnson Residence",
  "Rebecca",
  "John"
];

function setTitle(text){
  document.getElementById("pageTitle").textContent = text;
}

function setContent(html){
  document.getElementById("content").innerHTML = html;
  window.scrollTo(0,0);
}

function activeNav(button){
  document.querySelectorAll(".nav").forEach(x => x.classList.remove("active"));
  if(button) button.classList.add("active");
}

function openMenu(){
  document.getElementById("drawer").classList.add("open");
}

function closeMenu(){
  document.getElementById("drawer").classList.remove("open");
}

function openModal(html){
  document.getElementById("modalContent").innerHTML = html;
  document.getElementById("modal").classList.add("open");
}

function closeModal(){
  document.getElementById("modal").classList.remove("open");
}

function showHome(button){
  activeNav(button);
  setTitle("Plumbing Supply Manager");

  setContent(`
    <input class="search" placeholder="Search anything..."
      onkeyup="globalSearch(this.value)">

    <div class="grid">

      <div class="card home-card" onclick="showMyOrders()">
        <div class="icon">📦</div>
        <strong>My Orders</strong>
      </div>

      <div class="card home-card" onclick="showQuotes()">
        <div class="icon">📄</div>
        <strong>Quotes</strong>
      </div>

      <div class="card home-card" onclick="showCustomers()">
        <div class="icon">👥</div>
        <strong>Customers</strong>
      </div>

      <div class="card home-card create" onclick="showCreateOrder()">
        <div class="icon">＋</div>
        <strong>Create Order</strong>
      </div>

      <div class="card home-card" onclick="showInvoices()">
        <div class="icon">🧾</div>
        <strong>Invoices</strong>
      </div>

      <div class="card home-card" onclick="showReminders()">
        <div class="icon">🔔</div>
        <strong>Reminders</strong>
      </div>

    </div>
  `);
}

function globalSearch(value){
  if(!value.trim()) return;

  let v = value.toLowerCase();

  for(let company in companies){
    if(company.toLowerCase().includes(v)){
      showCompany(company);
      return;
    }

    let job = companies[company].find(x => x.toLowerCase().includes(v));

    if(job){
      showOrder(company,job);
      return;
    }
  }

  let shelf = shelves.find(x =>
    x.code.toLowerCase() === v ||
    x.description.toLowerCase().includes(v)
  );

  if(shelf){
    showShelf(shelf.code);
  }
}

function showMyOrders(button){
  activeNav(button);
  setTitle("My Orders");

  setContent(`
    <div class="list">

      <div class="row clickable" onclick="showContractors()">
        <div style="font-size:28px;">🔧</div>

        <div class="row-main">
          <div class="row-title">Plumbers / Contractors</div>
          <div class="row-sub">Companies and jobs</div>
        </div>

        <div>›</div>
      </div>

      <div class="row clickable" onclick="showHomeowners()">
        <div style="font-size:28px;">🏠</div>

        <div class="row-main">
          <div class="row-title">Homeowners</div>
          <div class="row-sub">Individual customer orders</div>
        </div>

        <div>›</div>
      </div>

    </div>
  `);
}

function showContractors(){
  setTitle("Plumbers / Contractors");

  let rows = Object.keys(companies).map(company => `
    <div class="row clickable" onclick="showCompany('${company.replaceAll("'","\\'")}')">

      <div class="row-main">
        <div class="row-title">${company}</div>
        <div class="row-sub">${companies[company].length} active jobs</div>
      </div>

      <div>›</div>
    </div>
  `).join("");

  setContent(`
    <button class="btn small" onclick="showMyOrders()">‹ Back</button>

    <div class="space"></div>

    <input class="search" placeholder="Search companies...">

    <div class="list">
      ${rows}
    </div>
  `);
}

function showCompany(company){
  setTitle(company);

  let jobs = companies[company];

  let rows = jobs.length
    ? jobs.map(job => `
      <div class="row clickable"
           onclick="showOrder('${company.replaceAll("'","\\'")}','${job.replaceAll("'","\\'")}')">

        <div class="row-main">
          <div class="row-title">${job}</div>
          <div class="row-sub">${getShelfForJob(job) || "No shelf assigned"}</div>
        </div>

        <div>›</div>
      </div>
    `).join("")
    : `
      <div class="card center">
        No active jobs.
      </div>
    `;

  setContent(`
    <button class="btn small" onclick="showContractors()">‹ Companies</button>

    <div class="space"></div>

    <div class="section-title">
      <h2>Jobs / Orders</h2>
    </div>

    <div class="list">
      ${rows}
    </div>
  `);
}

function showHomeowners(){
  setTitle("Homeowners");

  let rows = homeowners.map(name => `
    <div class="row clickable"
         onclick="showHomeownerOrder('${name.replaceAll("'","\\'")}')">

      <div class="row-main">
        <div class="row-title">${name}</div>
        <div class="row-sub">Homeowner</div>
      </div>

      <div>›</div>
    </div>
  `).join("");

  setContent(`
    <button class="btn small" onclick="showMyOrders()">‹ Back</button>

    <div class="space"></div>

    <input class="search" placeholder="Search homeowners...">

    <div class="list">
      ${rows}
    </div>
  `);
}

function showHomeownerOrder(name){
  setTitle(name);

  setContent(`
    <button class="btn small" onclick="showHomeowners()">‹ Homeowners</button>

    <div class="space"></div>

    <div class="card">

      <h2 style="margin-top:0">${name}</h2>

      <div class="info-box">
        <div class="info-label">Item</div>
        <div class="info-value">Kitchen Faucet</div>
        <div class="row-sub">Ordered: 1 &nbsp; Received: 1</div>
      </div>

      <div class="info-box">
        <div class="info-label">Item</div>
        <div class="info-value">Shower Trim</div>
        <div class="row-sub">Ordered: 2 &nbsp; Received: 1</div>
      </div>

      <div class="field">
        <label>Notes</label>
        <textarea></textarea>
      </div>

      <div class="field">
        <label>PO #</label>
        <input>
      </div>

      <div class="field">
        <label>SOE / Invoice</label>
        <input>
      </div>

    </div>
  `);
}

function getShelfForJob(job){
  let shelf = shelves.find(x => x.orders.includes(job));
  return shelf ? "Shelf " + shelf.code : null;
}

function showOrder(company,job){
  setTitle("Order Details");

  let shelf = shelves.find(x => x.orders.includes(job));

  let shelfHTML = shelf
    ? `
      <div class="info-box">
        <div class="info-label">Shelf Location</div>
        <div class="info-value">▦ ${shelf.code}</div>
        <div class="row-sub">${shelf.description}</div>
      </div>
    `
    : `
      <div class="info-box">
        <div class="info-label">Shelf Location</div>
        <div class="info-value">Not Assigned</div>
      </div>
    `;

  setContent(`
    <button class="btn small"
      onclick="showCompany('${company.replaceAll("'","\\'")}')">
      ‹ ${company}
    </button>

    <div class="space"></div>

    <div class="card">

      <h2 style="margin:0 0 5px;">${job}</h2>
      <div class="row-sub" style="margin-bottom:16px;">${company}</div>

      ${shelfHTML}

      <div class="row clickable">
        <div class="row-main">
          <div class="row-title">Items</div>
          <div class="row-sub">5 items</div>
        </div>
        <div>›</div>
      </div>

      <div class="space"></div>

      <div class="row clickable">
        <div class="row-main">
          <div class="row-title">Notes</div>
        </div>
        <div>›</div>
      </div>

      <div class="space"></div>

      <div class="row clickable">
        <div class="row-main">
          <div class="row-title">Shelf Photo</div>
          <div class="row-sub">Photo of all boxes on shelf</div>
        </div>
        <div>›</div>
      </div>

      <div class="space"></div>

      <div class="row clickable">
        <div class="row-main">
          <div class="row-title">Invoices</div>
        </div>
        <div>›</div>
      </div>

      <div class="space"></div>

      <button class="btn full soft"
        onclick="chooseShelf('${company.replaceAll("'","\\'")}','${job.replaceAll("'","\\'")}')">
        ${shelf ? "Move to Another Shelf" : "Assign Shelf"}
      </button>

      <div class="space"></div>

      <button class="btn full purple"
        onclick="confirmSendOut('${company.replaceAll("'","\\'")}','${job.replaceAll("'","\\'")}')">
        Send Out Order
      </button>

    </div>
  `);
}

function chooseShelf(company,job){

  let buttons = shelves.map(shelf => `
    <div class="row clickable"
         onclick="assignShelf(
           '${company.replaceAll("'","\\'")}',
           '${job.replaceAll("'","\\'")}',
           '${shelf.code}'
         )">

      <div class="row-main">
        <div class="row-title">${shelf.code}</div>
        <div class="row-sub">${shelf.description}</div>
      </div>

      <span class="badge ${shelf.orders.length ? "purple" : "green"}">
        ${shelf.orders.length ? shelf.orders.length+" Order" : "Available"}
      </span>

    </div>
  `).join("");

  openModal(`
    <h2>Assign Shelf</h2>
    <p style="color:var(--muted)">Choose a shelf or scan its QR code.</p>

    <button class="btn full purple"
      onclick="closeModal();showShelfScan('${company.replaceAll("'","\\'")}','${job.replaceAll("'","\\'")}')">
      Scan Shelf QR
    </button>

    <div class="space"></div>

    <div class="list">
      ${buttons}
    </div>

    <div class="space"></div>

    <button class="btn full" onclick="closeModal()">Cancel</button>
  `);
}

function assignShelf(company,job,code){

  shelves.forEach(shelf => {
    shelf.orders = shelf.orders.filter(x => x !== job);
  });

  let shelf = shelves.find(x => x.code === code);

  if(shelf && !shelf.orders.includes(job)){
    shelf.orders.push(job);
  }

  saveData();

  closeModal();

  showOrder(company,job);
}

function confirmSendOut(company,job){

  let shelfCode = getShelfForJob(job);

  openModal(`
    <h2>Send Out Order</h2>

    <p>
      Has <strong>${job}</strong> left the showroom?
    </p>

    <p style="color:var(--muted)">
      This will remove the order from
      ${shelfCode ? "<strong>"+shelfCode+"</strong>" : "its shelf"}
      and move it to Completed Orders.
    </p>

    <button class="btn full purple"
      onclick="sendOutOrder('${company.replaceAll("'","\\'")}','${job.replaceAll("'","\\'")}')">
      Yes, Send Out Order
    </button>

    <div class="space"></div>

function sendOutOrder(company,job){

  let oldShelf = shelves.find(x => x.orders.includes(job));

  shelves.forEach(shelf => {
    shelf.orders = shelf.orders.filter(x => x !== job);
  });

  companies[company] = companies[company].filter(x => x !== job);

  completedOrders.unshift({
    company:company,
    job:job,
    shelf:oldShelf ? oldShelf.code : "None",
    date:new Date().toLocaleDateString()
  });

  saveData();

  openModal(`
    <div class="center">

      <div style="font-size:65px;">✅</div>

      <h2>Order Sent Out!</h2>

      <p style="color:var(--muted)">
        ${job} has been removed from
        ${oldShelf ? "Shelf "+oldShelf.code : "its active location"}
        and moved to Completed Orders.
      </p>

      <button class="btn full purple"
        onclick="closeModal();showCompleted()">
        View Completed Orders
      </button>

      <div class="space"></div>

      <button class="btn full"
        onclick="closeModal();showCompany('${company.replaceAll("'","\\'")}')">
        Back to ${company}
      </button>

    </div>
  `);
}

function showShelves(){

  let rows = shelves.map(shelf => `

        <div class="row-sub">${shelf.description}</div>
      </div>

      <span class="badge ${shelf.orders.length ? "purple" : "green"}">
        ${
          shelf.orders.length
          ? shelf.orders.length + (shelf.orders.length===1 ? " Order" : " Orders")
          : "Available"
        }
      </span>

    </div>
  `).join("");

  setContent(`

function filterShelves(value){

  let v = value.toLowerCase();

  document.querySelectorAll("#shelfList .row").forEach(row => {
    row.style.display =
      row.innerText.toLowerCase().includes(v)
      ? "flex"
      : "none";
  });
}

function saveNewShelf(){

  let code =
    document.getElementById("newShelfCode")
    .value
    .trim()
    .toUpperCase();

  let description =
    document.getElementById("newShelfDescription")
    .value
    .trim();

  if(!code){
    alert("Please enter a Shelf Code.");
    return;
  }

  if(shelves.some(x => x.code === code)){
    alert("That shelf already exists.");
    return;
  }

  shelves.push({
    code:code,
    description:description || "Shelf Location",
    orders:[]
  });

  saveData();

  showShelfAdded(code);
}

function showShelf(code){

  if(!shelf) return;

  setTitle("Shelf Details");

  let orderRows = shelf.orders.length
    ? shelf.orders.map(job => {

        let company =
          Object.keys(companies)
          .find(c => companies[c].includes(job)) || "";

        return `
          <div class="row clickable"
            onclick="showOrder('${company.replaceAll("'","\\'")}','${job.replaceAll("'","\\'")}')">

            <div class="row-main">
              <div class="row-title">${job}</div>
              <div class="row-sub">${company}</div>
            </div>

            <div>›</div>
          </div>
        `;
      }).join("")
    : `
      <div class="card center">
        <div style="font-size:42px;">📭</div>

        <h3>No orders on this shelf</h3>

        <p style="color:var(--muted)">
          Shelf ${code} is available.
        </p>
      </div>
    `;

  setContent(`
    <button class="btn small"
      onclick="showShelves()">
      ‹ Shelf Locations
    </button>

    <div class="space"></div>

    <div class="card center">

      <div class="qr"></div>

      <div class="qr-label">${shelf.code}</div>

      <div style="font-weight:800;margin-top:5px;">
        ${shelf.description}
      </div>

      <div style="margin-top:10px;">
        <span class="badge ${shelf.orders.length ? "purple" : "green"}">
          ${
            shelf.orders.length
            ? shelf.orders.length + " Order"
            : "Available"
          }
        </span>
      </div>

      <div class="space"></div>

      <div class="two-buttons">
        <button class="btn soft"
          onclick="editShelf('${shelf.code}')">
          Edit Shelf

          onclick="showLocationScan()">
          Scan Shelf

    <div class="space"></div>

    <div class="section-title">
      <h2>Orders on This Shelf</h2>
    </div>

      ${orderRows}
    </div>
  `);
}

function saveNewOrder(){

    document.getElementById("newCompany").value.trim();

    document.getElementById("newJob").value.trim();

    return;

  if(!companies[company]){
    companies[company]=[];

  companies[company].push(job);

  saveData();

  alert("Order saved!");

  showOrder(company,job);
}

function saveData(){

  localStorage.setItem(
    "psmShelves",
    JSON.stringify(shelves)
  );

  localStorage.setItem(
    "psmCompanies",
    JSON.stringify(companies)
  );

  localStorage.setItem(
    "psmCompleted",
    JSON.stringify(completedOrders)
  );
}

function loadData(){

  let savedShelves =
    localStorage.getItem("psmShelves");

  let savedCompanies =
    localStorage.getItem("psmCompanies");

  let savedCompleted =
    localStorage.getItem("psmCompleted");

  if(savedShelves){
    shelves=JSON.parse(savedShelves);
  }

  if(savedCompanies){
    companies=JSON.parse(savedCompanies);
  }

  if(savedCompleted){
    completedOrders=JSON.parse(savedCompleted);
  }
}

showHome();
