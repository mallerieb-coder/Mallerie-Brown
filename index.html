<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f6fa">

<title>Plumbing Supply Manager</title>

<style>
:root{
  --purple:#7847e8;
  --purple2:#8b55ed;
  --purpleSoft:#f0e9ff;
  --bg:#f7f6fa;
  --card:#ffffff;
  --text:#17151b;
  --muted:#77727e;
  --line:#e5e1e9;
  --orange:#f39a16;
  --red:#e53935;
  --green:#39a96b;
  --shadow:0 8px 24px rgba(37,25,55,.08);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:#eeeef3;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--text);
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(100%,700px);
  min-height:100vh;
  margin:auto;
  background:var(--bg);
  padding-bottom:92px;
}

/* HEADER */

.top{
  height:86px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:20;
}

.menuBtn{
  border:0;
  background:transparent;
  color:#168cff;
  font-size:27px;
  padding:8px;
}

.pageTitle{
  flex:1;
  font-size:23px;
  font-weight:850;
}

.bellBtn{
  position:relative;
  border:0;
  background:transparent;
  font-size:32px;
  padding:8px 12px;
}

.badge{
  position:absolute;
  top:2px;
  right:1px;
  min-width:22px;
  height:22px;
  padding:0 6px;
  border-radius:20px;
  background:var(--red);
  color:white;
  border:2px solid white;
  font-size:12px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* GENERAL */

.content{
  padding:24px 20px;
}

.screen{
  display:none;
}

.screen.active{
