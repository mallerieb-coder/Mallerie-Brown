<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f6fa">

<title>Plumbing Supply Manager</title>

<style>
:root{
  --purple:#7847e8;
  --purple2:#8b55ed;
  --purpleSoft:#f0e9ff;
  --bg:#f7f6fa;
  --card:#ffffff;
  --text:#17151b;
  --muted:#77727e;
  --line:#e5e1e9;
  --orange:#f39a16;
  --red:#e53935;
  --green:#39a96b;
  --shadow:0 8px 24px rgba(37,25,55,.08);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:#eeeef3;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--text);
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(100%,700px);
  min-height:100vh;
  margin:auto;
  background:var(--bg);
  padding-bottom:92px;
}

/* HEADER */

.top{
  height:86px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:20;
}

.menuBtn{
  border:0;
  background:transparent;
  color:#168cff;
  font-size:27px;
  padding:8px;
}

.pageTitle{
  flex:1;
  font-size:23px;
  font-weight:850;
}

.bellBtn{
  position:relative;
  border:0;
  background:transparent;
  font-size:32px;
  padding:8px 12px;
}

.badge{
  position:absolute;
  top:2px;
  right:1px;
  min-width:22px;
  height:22px;
  padding:0 6px;
  border-radius:20px;
  background:var(--red);
  color:white;
  border:2px solid white;
  font-size:12px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* GENERAL */

.content{
  padding:24px 20px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.search,
.field{
  width:100%;
  padding:15px 16px;
  background:white;
  border:1px solid var(--line);
  border-radius:16px;
  outline:none;
  font-size:16px;
}

.search:focus,
.field:focus{
  border-color:#b89cff;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.tile{
  min-height:132px;
  padding:20px;
  border:1px solid var(--line);
  border-radius:20px;
  background:#fff;
  text-align:left;
  box-shadow:0 2px 8px rgba(0,0,0,.025);
}

.tile.primary{
  color:white;
  border-color:var(--purple);
  background:linear-gradient(135deg,var(--purple),var(--purple2));
}

.tileIcon{
  display:block;
  font-size:29px;
  margin-bottom:28px;
}

.tileTitle{
  font-size:18px;
  font-weight:850;
}

.card{
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 3px 10px rgba(0,0,0,.025);
}

.row{
  display:flex;
  align-items:center;
  gap:12px;
}

.grow{
  flex:1;
}

.strong{
  font-weight:850;
}

.muted{
  color:var(--muted);
  font-size:13px;
}

.tiny{
  color:var(--muted);
  font-size:11px;
}

.sectionTitle{
  font-size:13px;
  font-weight:850;
  margin:22px 2px 9px;
  color:#55505a;
}

.btn{
  border:0;
  border-radius:14px;
  padding:13px 16px;
  font-weight:800;
}

.btn.primary{
  background:var(--purple);
  color:white;
}

.btn.secondary{
  background:var(--purpleSoft);
  color:var(--purple);
}

.btn.danger{
  background:#fff0f0;
  color:#d93025;
}

.btn.full{
  width:100%;
}

.back{
  border:0;
  background:transparent;
  color:var(--purple);
  font-weight:800;
  padding:3px 0 12px;
}

.linkBtn{
  border:0;
  background:transparent;
  color:var(--purple);
  font-weight:800;
}

.headerRow{
  display:flex;
  align-items:center;
  gap:10px;
}

.headerRow h2,
.headerRow h3{
  flex:1;
  margin:0;
}

.choice{
  border:1px solid var(--line);
  background:white;
  border-radius:18px;
  padding:20px 15px;
  text-align:left;
  min-height:120px;
}

.choiceIcon{
  font-size:30px;
  margin-bottom:12px;
}

.choiceTitle{
  font-weight:850;
  font-size:16px;
}

.pill{
  display:inline-block;
  padding:7px 11px;
  border-radius:999px;
  background:#f2eff5;
  color:#625c67;
  font-size:12px;
  font-weight:800;
}

.pill.purple{
  background:var(--purpleSoft);
  color:var(--purple);
}

.pill.green{
  background:#e8f8ef;
  color:#218653;
}

.pill.orange{
  background:#fff0dc;
  color:#d77b00;
}

.label{
  display:block;
  margin:13px 0 6px;
  font-size:12px;
  font-weight:850;
}

textarea.field{
  min-height:90px;
  resize:vertical;
}

/* HOME */

.homeGrid{
  margin-top:16px;
}

/* BOTTOM NAV */

.bottomNav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(100%,700px);
  height:82px;
  background:white;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:30;
  padding-bottom:env(safe-area-inset-bottom);
}

.navBtn{
  border:0;
  background:white;
  color:#77727e;
  font-size:11px;
  font-weight:700;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
}

.navIcon{
  font-size:22px;
}

.navBtn.active{
  color:var(--purple);
}

/* TEAM DRAWER */

.drawerMask{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.35);
  display:none;
}

.drawer{
  width:min(82%,340px);
  height:100%;
  background:white;
  padding:24px 16px;
  box-shadow:10px 0 30px rgba(0,0,0,.15);
}

.drawerTop{
  display:flex;
  align-items:center;
  margin-bottom:20px;
}

.drawerTop h2{
  flex:1;
  margin:0;
}

.closeBtn{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#f2eff5;
  font-size:24px;
}

.teamButton{
  width:100%;
  border:0;
  border-bottom:1px solid var(--line);
  background:white;
  padding:16px 8px;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
}

.avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  background:var(--purpleSoft);
  color:var(--purple);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

/* REMINDER MODAL */

.reminderOverlay{
  position:fixed;
  inset:0;
  z-index:80;
  background:rgba(20,15,30,.18);
  display:none;
  align-items:center;
  justify-content:center;
  padding:22px;
}

.reminderModal{
  width:min(100%,620px);
  max-height:78vh;
  overflow:auto;
  background:white;
  border-radius:22px;
  box-shadow:0 20px 60px rgba(30,20,45,.25);
  padding:18px;
}

.reminderModalHeader{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.reminderModalHeader .bell{
  font-size:28px;
}

.reminderModalHeader h2{
  flex:1;
  margin:0;
  font-size:21px;
}

.reminderTabs{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-bottom:13px;
}

.remTab{
  border:1px solid var(--line);
  background:#f7f5fa;
  border-radius:12px;
  padding:11px 6px;
  font-size:12px;
  font-weight:800;
}

.remTab.active{
  background:linear-gradient(135deg,var(--purple),var(--purple2));
  color:white;
  border-color:var(--purple);
}

.reminderItem{
  display:flex;
  align-items:center;
  gap:12px;
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px;
  margin:10px 0;
}

.remCircle{
  width:28px;
  height:28px;
  border:3px solid var(--purple);
  border-radius:50%;
  flex:0 0 auto;
}

.remCircle.orange{
  border-color:var(--orange);
}

.remText{
  flex:1;
  min-width:0;
}

.remTitle{
  font-weight:850;
  font-size:14px;
}

.remCompany{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

.remDate{
  font-size:12px;
  color:#55505d;
  margin-top:4px;
}

.remTag{
  border-radius:999px;
  padding:7px 12px;
  font-size:11px;
  font-weight:850;
  background:var(--purpleSoft);
  color:var(--purple);
}

.remTag.orange{
  background:#fff0da;
  color:#d57b00;
}

.chevron{
  font-size:25px;
  color:#55515a;
}

.addReminderBig{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  color:white;
  font-weight:850;
  font-size:15px;
  background:linear-gradient(135deg,var(--purple),var(--purple2));
  margin-top:12px;
}

/* ORDERS */

.orderTable{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

.orderTable th,
.orderTable td{
  border-bottom:1px solid var(--line);
  padding:10px 4px;
  text-align:left;
}

.orderTable th{
  color:var(--muted);
  font-size:11px;
}

.qtyBtn{
  width:30px;
  height:30px;
  border:1px solid var(--line);
  border-radius:9px;
  background:white;
}

/* SHELVES */

.shelfGroup{
  margin-top:22px;
}

.shelfGroupTitle{
  font-size:14px;
  font-weight:900;
  margin-bottom:8px;
}

.shelfGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.shelfBtn{
  border:1px solid var(--line);
  border-radius:13px;
  padding:12px 7px;
  background:white;
  font-weight:850;
}

.shelfBtn.occupied{
  background:var(--purpleSoft);
  color:var(--purple);
}

.barcodeBox{
  margin:14px 0;
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
  text-align:center;
  background:white;
}

.fakeBarcode{
  height:58px;
  margin:10px auto;
  max-width:300px;
  background:
    repeating-linear-gradient(
      90deg,
      #111 0px,
      #111 2px,
      transparent 2px,
      transparent 5px,
      #111 5px,
      #111 9px,
      transparent 9px,
      transparent 12px
    );
}

.photoBox{
  border:2px dashed #cdbfff;
  background:#fbf9ff;
  border-radius:17px;
  padding:25px;
  text-align:center;
  margin:12px 0;
}

/* SETTINGS */

.settingsRow{
  width:100%;
  border:1px solid var(--line);
  border-radius:17px;
  background:white;
  padding:17px;
  margin:11px 0;
  display:flex;
  align-items:center;
  gap:13px;
  text-align:left;
}

.settingsIcon{
  font-size:25px;
}

/* SCAN */

.cameraBox{
  border:2px dashed #bfaaff;
  background:#faf8ff;
  border-radius:22px;
  padding:48px 20px;
  text-align:center;
}

.cameraIcon{
  font-size:52px;
}

.scanStep{
  display:flex;
  gap:11px;
  align-items:flex-start;
  margin:11px 0;
}

.stepNum{
  width:29px;
  height:29px;
  border-radius:50%;
  background:var(--purple);
  color:white;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
}

/* MOBILE */

@media(max-width:480px){
  .top{
    padding:0 14px;
  }

  .pageTitle{
    font-size:19px;
  }

  .content{
    padding:18px 14px;
  }

  .tile{
    min-height:118px;
    padding:16px;
  }

  .tileIcon{
    margin-bottom:22px;
  }

  .reminderOverlay{
    padding:10px;
  }

  .reminderModal{
    padding:14px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="top">
  <button class="menuBtn" onclick="openDrawer()">☰</button>

  <div id="pageTitle" class="pageTitle">
    Plumbing Supply Manager
  </div>

  <button class="bellBtn" onclick="openReminderPopup()">
    🔔
    <span id="reminderBadge" class="badge">3</span>
  </button>
</header>

<main>

<!-- HOME -->

<section id="home" class="screen active content">

  <input
    id="globalSearch"
    class="search"
    placeholder="Search anything..."
    oninput="globalSearch()"
  >

  <div id="searchResults"></div>

  <div class="grid2 homeGrid">

    <button class="tile" onclick="showScreen('orders')">
      <span class="tileIcon">📦</span>
      <span class="tileTitle">My Orders</span>
    </button>

    <button class="tile" onclick="showScreen('quotes')">
      <span class="tileIcon">📄</span>
      <span class="tileTitle">Quotes</span>
    </button>

    <button class="tile" onclick="showScreen('customers')">
      <span class="tileIcon">👥</span>
      <span class="tileTitle">Customers</span>
    </button>

    <button class="tile primary" onclick="showScreen('createOrder')">
      <span class="tileIcon">＋</span>
      <span class="tileTitle">Create Order</span>
    </button>

    <button class="tile" onclick="showScreen('invoices')">
      <span class="tileIcon">🧾</span>
      <span class="tileTitle">Invoices</span>
    </button>

    <button class="tile" onclick="showScreen('reminders')">
      <span class="tileIcon">🔔</span>
      <span class="tileTitle">Reminders</span>
    </button>

  </div>

</section>


<!-- MY ORDERS -->

<section id="orders" class="screen content">

  <h2>My Orders</h2>

  <div class="grid2">

    <button class="choice" onclick="showContractors()">
      <div class="choiceIcon">👷</div>
      <div class="choiceTitle">Plumbers / Contractors</div>
      <div class="muted">Company → Jobs → Orders</div>
    </button>

    <button class="choice" onclick="showHomeowners()">
      <div class="choiceIcon">🏠</div>
      <div class="choiceTitle">Homeowners</div>
      <div class="muted">Individual customer orders</div>
    </button>

  </div>

</section>


<!-- CONTRACTORS -->

<section id="contractors" class="screen content">

  <button class="back" onclick="showScreen('orders')">← My Orders</button>

  <div class="headerRow">
    <h2>Plumbers / Contractors</h2>
    <button class="linkBtn" onclick="addCompany()">+ Add</button>
  </div>

  <input
    class="search"
    placeholder="Search companies..."
    oninput="renderCompanies(this.value)"
  >

  <div id="companyList"></div>

</section>


<!-- COMPANY JOBS -->

<section id="companyJobs" class="screen content">

  <button class="back" onclick="showContractors()">← Companies</button>

  <div class="headerRow">
    <h2 id="companyHeading"></h2>
    <button class="linkBtn" onclick="addJob()">+ Add Job</button>
  </div>

  <input
    class="search"
    placeholder="Search jobs..."
    oninput="renderJobs(this.value)"
  >

  <div id="jobList"></div>

</section>


<!-- HOMEOWNERS -->

<section id="homeowners" class="screen content">

  <button class="back" onclick="showScreen('orders')">← My Orders</button>

  <div class="headerRow">
    <h2>Homeowners</h2>
    <button class="linkBtn" onclick="addHomeowner()">+ Add</button>
  </div>

  <input
    class="search"
    placeholder="Search homeowners..."
    oninput="renderHomeowners(this.value)"
  >

  <div id="homeownerList"></div>

</section>


<!-- HOMEOWNER ORDERS -->

<section id="homeownerOrders" class="screen content">

  <button class="back" onclick="showHomeowners()">← Homeowners</button>

  <h2 id="homeownerHeading"></h2>

  <div id="homeownerOrderList"></div>

</section>


<!-- ORDER DETAIL -->

<section id="orderDetail" class="screen content">

  <button class="back" onclick="orderBack()">← Back</button>

  <div id="orderDetailContent"></div>

</section>


<!-- QUOTES -->

<section id="quotes" class="screen content">

  <div class="headerRow">
    <h2>Quotes</h2>
    <button class="linkBtn" onclick="addQuote()">+ Add / Scan Quote</button>
  </div>

  <input class="search" placeholder="Search quotes..." oninput="renderQuotes(this.value)">

  <div id="quoteList"></div>

</section>


<!-- CUSTOMERS -->

<section id="customers" class="screen content">

  <div class="headerRow">
    <h2>Customers</h2>
    <button class="linkBtn" onclick="addCustomer()">+ Add Contact</button>
  </div>

  <input
    class="search"
    placeholder="Search by name or phone..."
    oninput="renderCustomers(this.value)"
  >

  <div id="customerList"></div>

</section>


<!-- INVOICES -->

<section id="invoices" class="screen content">

  <div class="headerRow">
    <h2>Invoices</h2>
    <button class="linkBtn" onclick="addInvoice()">+ Add / Scan</button>
  </div>

  <input class="search" placeholder="Search invoices..." oninput="renderInvoices(this.value)">

  <div id="invoiceList"></div>

</section>


<!-- CREATE ORDER -->

<section id="createOrder" class="screen content">

  <div class="card">

    <h2 style="margin-top:0">New Order Sheet</h2>

    <label class="label">Company / Plumber</label>
    <input id="newCompany" class="field" placeholder="Company / Plumber">

    <label class="label">Job / Order</label>
    <input id="newJob" class="field" placeholder="Job / Order">

    <label class="label">Date</label>
    <input id="newDate" class="field" type="date">

    <div class="sectionTitle">Items</div>

    <div id="newOrderLines"></div>

    <button class="btn secondary" onclick="addOrderLine()">
      + Add Another Line
    </button>

    <label class="label">Notes / Special Instructions</label>
    <textarea id="newNotes" class="field"></textarea>

    <button
      class="btn primary full"
      style="margin-top:16px"
      onclick="saveNewOrder()"
    >
      Save Order
    </button>

  </div>

</section>


<!-- REMINDERS FULL PAGE -->

<section id="reminders" class="screen content">

  <div class="headerRow">
    <h2>Reminders</h2>
    <button class="linkBtn" onclick="showReminderForm()">+ Add Reminder</button>
  </div>

  <div id="reminderForm" class="card" style="display:none">

    <label class="label">Company / Plumber</label>
    <input id="remCompany" class="field">

    <label class="label">Job / Order</label>
    <input id="remJob" class="field">

    <label class="label">Date & Time</label>
    <input id="remDate" class="field" type="datetime-local">

    <label class="label">Reminder</label>
    <input id="remText" class="field">

    <label class="label">Type</label>
    <select id="remType" class="field">
      <option>Follow Up</option>
      <option>Order</option>
      <option>Call</option>
      <option>Invoice</option>
      <option>Delivery</option>
      <option>Other</option>
    </select>

    <label class="label">Notes</label>
    <textarea id="remNotes" class="field"></textarea>

    <button
      class="btn primary full"
      style="margin-top:14px"
      onclick="saveReminder()"
    >
      Save Reminder
    </button>

  </div>

  <div id="fullReminderList"></div>

</section>


<!-- SCAN -->

<section id="scan" class="screen content">

  <div class="cameraBox">

    <div class="cameraIcon">📷</div>

    <h2>Scan</h2>

    <div class="muted">
      Scan a product box, invoice, quote, or shelf barcode.
    </div>

    <button
      class="btn primary"
      style="margin-top:18px"
      onclick="openScanOptions()"
    >
      Open Camera
    </button>

  </div>

</section>


<!-- SCAN OPTIONS -->

<section id="scanOptions" class="screen content">

  <button class="back" onclick="showScreen('scan')">← Scan</button>

  <h2>What is this?</h2>

  <div class="grid2">

    <button class="choice" onclick="startBoxScan()">
      <div class="choiceIcon">📦</div>
      <div class="choiceTitle">Box Scan</div>
      <div class="muted">Scan product boxes & match to order</div>
    </button>

    <button class="choice" onclick="startDocumentScan('Invoice')">
      <div class="choiceIcon">🧾</div>
      <div class="choiceTitle">Invoice Scan</div>
      <div class="muted">Add invoice to a job</div>
    </button>

    <button class="choice" onclick="startDocumentScan('Quote')">
      <div class="choiceIcon">📄</div>
      <div class="choiceTitle">Quote Scan</div>
      <div class="muted">Add quote to Quotes</div>
    </button>

    <button class="choice" onclick="startLocationScan()">
      <div class="choiceIcon">📍</div>
      <div class="choiceTitle">Location Scan</div>
      <div class="muted">Scan shelf barcode</div>
    </button>

  </div>

</section>


<!-- SCAN FLOW -->

<section id="scanFlow" class="screen content">

  <button class="back" onclick="showScreen('scanOptions')">
    ← Scan Options
  </button>

  <h2 id="scanFlowTitle"></h2>

  <div id="scanFlowContent"></div>

</section>


<!-- SETTINGS -->

<section id="settings" class="screen content">

  <h2>Settings</h2>

  <button class="settingsRow" onclick="showShelfLocations()">
    <span class="settingsIcon">🏷️</span>
    <span class="grow">
      <span class="strong">Shelf Locations</span>

function saveState(){

    localStorage.setItem(
      "plumbingSupplyManagerV4",
      JSON.stringify(state)
    );

    console.log("Save error",e);
  }

function loadState(){

  let saved = null;

  try{
    saved = JSON.parse(
      localStorage.getItem("plumbingSupplyManagerV4")
    );
  }catch(e){}

  if(saved){

    state = {
      ...state,
      ...saved
    };

  }

  mergeShelves();

}


function mergeShelves(){

  const old = Array.isArray(state.shelves)
    ? state.shelves
    : [];

  const map = {};

  old.forEach(s=>{
    if(s && s.code){
      map[String(s.code).toUpperCase()] = s;
    }
  });

  let merged = REAL_SHELVES.map(base=>{

    const prior = map[base.code];

    if(prior){

      return {
        ...base,
        ...prior,
        code:base.code,
        section:base.section,
        description:prior.description || base.description,
        orders:Array.isArray(prior.orders)
          ? prior.orders
          : [],
        photo:prior.photo || ""
      };

    }

    return {
      ...base,
      orders:[],
      photo:""
    };

  });

  old.forEach(s=>{

    if(!s || !s.code) return;

    const code = String(s.code).toUpperCase();

    const exists = merged.some(x=>x.code===code);

    const oldDemo =
      ["A1","A2","A3","B1","B2","B3"].includes(code);

    const occupied =
      Array.isArray(s.orders) &&
      s.orders.length>0;

    if(!exists && (!oldDemo || occupied)){

      merged.push({
        code,
        section:s.section || "Other",
        description:s.description || "Other",
        orders:s.orders || [],
        photo:s.photo || ""
      });

    }

  });

  state.shelves = merged;

  syncOrderShelves();

  saveState();

}


function syncOrderShelves(){

  state.shelves.forEach(s=>{
    s.orders = [];
  });

  state.orders.forEach(o=>{

    if(!o.shelf) return;

    const shelf = state.shelves.find(
      s=>s.code===String(o.shelf).toUpperCase()
    );

    if(shelf && !shelf.orders.includes(o.id)){
      shelf.orders.push(o.id);
    }

  });

}

function updateOrderField(field,value){

  const o=state.orders.find(x=>x.id===currentOrderId);

  if(!o) return;

  o[field]=value;

  saveState();

}


function changeReceived(index,amount){

  const o=state.orders.find(x=>x.id===currentOrderId);

  if(!o) return;

  const item=o.items[index];

  item.received=Math.max(
    0,
    Math.min(
      Number(item.ordered),
      Number(item.received)+amount
    )
  );

  saveState();

  openOrder(o.id);

}

function saveNewOrder(){

  const company=
    document.getElementById("newCompany").value.trim();

  const job=
    document.getElementById("newJob").value.trim();

  if(!company || !job){

    alert(
      "Please enter the Company / Plumber and Job / Order."
    );

    return;

  }

  const rows=[
    ...document.querySelectorAll("#newOrderLines .row")
  ];

  const items=[];

  rows.forEach(row=>{

    const qty=parseInt(
      row.querySelector(".orderQty").value
    ) || 0;

    const name=
      row.querySelector(".orderDescription").value.trim();

    if(name){

      items.push({
        name,
        ordered:qty || 1,
        received:0
      });

    }

  });

  if(!state.companies[company]){
    state.companies[company]=[];
  }

  if(!state.companies[company].includes(job)){
    state.companies[company].push(job);
  }

  const order={

    id:Date.now(),

    type:"company",

    company,

    job,

    owner:"Mallerie",

    shelf:"",

    notes:
      document.getElementById("newNotes").value,

    po:"",

    invoice:"",

    items

  };

  state.orders.push(order);

  saveState();

  alert("Order saved!");

  document.getElementById("newCompany").value="";
  document.getElementById("newJob").value="";
  document.getElementById("newNotes").value="";
  document.getElementById("newOrderLines").innerHTML="";

  showScreen("orders");

function saveShelfPhoto(event,code){

  const file=event.target.files[0];

  if(!file) return;

  const reader=new FileReader();

  reader.onload=function(e){

    const shelf=state.shelves.find(
      s=>s.code===code
    );

    if(!shelf) return;

    shelf.photo=e.target.result;

    try{

      saveState();

    }catch(err){

      alert(
        "The photo was too large to save. Try taking a smaller photo."
      );

    }

    openShelf(code);

  };

  reader.readAsDataURL(file);

}

function chooseShelfForOrder(){

  const o=state.orders.find(
    x=>x.id===currentOrderId

  if(!o) return;

  const code=prompt(
    "Scan or enter Shelf Barcode / Shelf Code",
    o.shelf || ""
  );

  if(!code) return;

  assignShelfToOrder(code);

}


function assignShelfToOrder(code){

  code=String(code).trim().toUpperCase();

  const shelf=state.shelves.find(
    s=>s.code===code
  );

  if(!shelf){

    alert(
      "Shelf "+code+" was not found."
    );

    return;

  }

  const o=state.orders.find(
    x=>x.id===currentOrderId
  );

  if(!o) return;

  state.shelves.forEach(s=>{

    s.orders=s.orders.filter(
      id=>id!==o.id
    );

  });

  o.shelf=code;

  if(!shelf.orders.includes(o.id)){
    shelf.orders.push(o.id);
  }

  saveState();

  alert(
    o.job+" is now assigned to shelf "+code+"."
  );

  openOrder(o.id);

}

function confirmSendOut(){

  const o=state.orders.find(
    x=>x.id===currentOrderId
  );

  if(!o) return;

  const yes=confirm(
    "Has this order left the showroom?\n\n"+
    "This will remove it from the shelf and move it to Completed Orders."
  );

  if(!yes) return;

  const previousShelf=o.shelf || "";

  state.shelves.forEach(s=>{

    s.orders=s.orders.filter(
      id=>id!==o.id
    );

  });

  state.completed.unshift({

    ...o,

    previousShelf,

    completedDate:new Date().toLocaleString()

  });

  state.orders=state.orders.filter(
    x=>x.id!==o.id
  );

  saveState();

  alert("Order moved to Completed Orders.");

  showScreen("orders");

}

function boxScanTest(){

  const company=prompt("Company / Plumber");

  if(!company) return;

  const job=prompt("Job / Order");

  if(!job) return;

  const order=state.orders.find(
    o=>
      o.company.toLowerCase()===company.toLowerCase() &&
      o.job.toLowerCase()===job.toLowerCase()
  );

  if(!order){

    alert(
      "I couldn't find that order. You can create it first from Create Order."
    );

    return;

  }

  const item=prompt("Item / Description");

  if(!item) return;

  const qty=parseInt(
    prompt("Quantity received","1")
  ) || 1;

  const shelfCode=prompt(
    "Scan or enter Shelf Barcode"
  );

  if(!shelfCode) return;

  const shelf=state.shelves.find(
    s=>
      s.code===
      shelfCode.trim().toUpperCase()
  );

  if(!shelf){

    alert("Shelf not found.");

    return;

  }

  let existing=order.items.find(
    i=>i.name.toLowerCase()===item.toLowerCase()
  );

  if(existing){

    existing.received=Math.min(
      existing.ordered,
      existing.received+qty
    );

  }else{

    order.items.push({
      name:item,
      ordered:qty,
      received:qty
    });

  }

  state.shelves.forEach(s=>{

    s.orders=s.orders.filter(
      id=>id!==order.id
    );

  });

  order.shelf=shelf.code;

  shelf.orders.push(order.id);

  saveState();

  alert(
    "Saved! "+job+
    " is connected to shelf "+
    shelf.code+"."
  );

  currentShelfCode=shelf.code;

  openShelf(shelf.code);

}


function startLocationScan(){

  showScreen("scanFlow");

  document.getElementById("scanFlowTitle")
    .textContent="Location Scan";

  document.getElementById("scanFlowContent").innerHTML=`

    <div class="cameraBox">

      <div class="cameraIcon">▥</div>

      <div class="strong">
        Scan Shelf Barcode
      </div>

      <div class="muted">
        Scan the permanent Code 128 label on the shelf.
      </div>

      <button
        class="btn primary"
        style="margin-top:16px"
        onclick="manualShelfScan()"
      >
        Scan / Enter Shelf Code
      </button>

    </div>

  `;

}


function manualShelfScan(){

  const code=prompt(
    "Shelf Barcode / Shelf Code"
  );

  if(!code) return;

  const normalized=
    code.trim().toUpperCase();

  const shelf=state.shelves.find(
    s=>s.code===normalized
  );

  if(!shelf){

    alert("Shelf "+normalized+" was not found.");

    return;

  }

  openShelf(normalized);

}


function startDocumentScan(type){

  showScreen("scanFlow");

  document.getElementById("scanFlowTitle")
    .textContent=type+" Scan";

  document.getElementById("scanFlowContent").innerHTML=`

    <div class="cameraBox">

      <div class="cameraIcon">
        ${type==="Invoice"?"🧾":"📄"}
      </div>

      <div class="strong">
        ${type} Scan
      </div>

      <div class="muted">
        Take a photo of the ${type.toLowerCase()}.
      </div>

      <input
        type="file"
        accept="image/*"
        capture="environment"
        style="margin-top:18px"
      >

    </div>

    ${scanStep(1,"Select Company","Choose the Company / Plumber.")}

    ${scanStep(2,"Select Job","Choose the Job / Order.")}

    ${scanStep(3,"Review","Review the scanned ${type.toLowerCase()}.")}

    ${scanStep(4,"Save","Save it to the correct job.")}

    <button
      class="btn primary full"
      onclick="${type==="Invoice"?"addInvoice()":"addQuote()"}"
    >
      Save ${type}
    </button>

  `;

}


function scanStep(number,title,text){

  return `

    <div class="scanStep">

      <div class="stepNum">
        ${number}
      </div>

      <div class="card grow" style="margin:0">

        <div class="strong">
          ${escapeHTML(title)}
        </div>

        <div class="muted">
          ${escapeHTML(text)}
        </div>

      </div>

    </div>

  `;

}


/* =========================
   SEARCH
========================= */

function globalSearch(){

  const q=document.getElementById("globalSearch")
    .value.toLowerCase().trim();

  const box=document.getElementById("searchResults");

  if(!q){

    box.innerHTML="";

    return;

  }

  const results=state.orders.filter(o=>{

    const itemText=o.items
      .map(i=>i.name)
      .join(" ");

    return (
      o.company+" "+
      o.job+" "+
      o.owner+" "+
      o.shelf+" "+
      itemText
    ).toLowerCase().includes(q);

  });

  box.innerHTML=`

    <div class="sectionTitle">
      Search Results
    </div>

    ${
      results.length
      ? results.map(o=>orderCard(o,"home")).join("")
      : `<div class="card muted">
           No matching orders.
         </div>`
    }

  `;

}


/* =========================
   HELPERS
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function safeJS(value){

  return String(value ?? "")
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");

}


/* =========================
   START APP
========================= */

loadState();

renderDrawerTeam();

updateReminderBadge();

showScreen("home");

</script>
