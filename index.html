  --purple:#7b4fe0;
  --light:#efe8ff;
  --bg:#f7f7fb;

  --text:#17171c;
  --muted:#73737d;
  --line:#e5e5ec;
  --green:#2cac6d;
  --red:#d95353;
  --orange:#d3982e;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding-bottom:95px;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  padding:15px;
  background:#fff;
  border-bottom:1px solid var(--line);
}

header h1{

}

.icon{

main{

.card{

  padding:16px;

}

.grid{

  grid-template-columns:1fr 1fr;
  gap:12px;
}

.home{

.home .emoji{

.home.create{

.search,
input,

textarea{

  padding:12px;
  background:#fff;
  font:inherit;
}

.search{

}

label{

  font-size:13px;
  font-weight:700;

}

textarea{

}

.row{

  gap:12px;

  padding:14px;
  margin-bottom:10px;

.row-main{

.title{

.sub{

.badge{

.available{

.used{

.orange{

.btn{

.purple{

.soft{

.gray{

.red{

.small{

.heading{

.bottom{

.nav{

.drawer{

.drawer.open{

}

.shade{

.center{

/* -----------------------------
   SAVE / LOAD
----------------------------- */

function save(){

  localStorage.setItem(
    "shelves",
    JSON.stringify(shelves)
  );

  localStorage.setItem(
    "companies",
    JSON.stringify(companies)
  );

  localStorage.setItem(
    "completed",
    JSON.stringify(completedOrders)
  );

  localStorage.setItem(
    "teamOrders",
    JSON.stringify(teamOrders)
  );

  localStorage.setItem(
    "shelfPhotos",
    JSON.stringify(shelfPhotos)
  );
}


function load(){

  try{

    if(localStorage.companies){
      companies =
        JSON.parse(
          localStorage.companies
        );
    }

    if(localStorage.completed){
      completedOrders =
        JSON.parse(
          localStorage.completed
        );
    }

    if(localStorage.teamOrders){
      teamOrders =
        JSON.parse(
          localStorage.teamOrders
        );
    }

    if(localStorage.shelfPhotos){
      shelfPhotos =
        JSON.parse(
          localStorage.shelfPhotos
        );
    }

    let oldShelves = [];

    if(localStorage.shelves){
      oldShelves =
        JSON.parse(
          localStorage.shelves
        );
    }

    let oldShelfMap = {};

    oldShelves.forEach(shelf => {

      let code =
        String(
          shelf.code || ""
        )
        .trim()
        .toUpperCase();

      oldShelfMap[code] = shelf;

    });


    /*
      Build the shelf list from your
      REAL shelf locations.

      If one of those shelves already
      has an order saved to it, we keep
      that order assignment.
    */

    shelves =
      REAL_SHELVES.map(realShelf => {

        let oldShelf =
          oldShelfMap[
            realShelf.code
          ];

        if(oldShelf){

          return {
            ...realShelf,

            orders:
              oldShelf.orders || []
          };

        }

        return {
          ...realShelf
        };

      });


    /*
      Keep any custom shelf you add
      later through Settings.

      Old A1-A3 / B1-B3 test shelves
      are intentionally NOT restored.
    */

    oldShelves.forEach(oldShelf => {

      let code =
        String(
          oldShelf.code || ""
        )
        .trim()
        .toUpperCase();

      let oldTestShelf =
        /^(A[1-3]|B[1-3])$/
        .test(code);

      let alreadyExists =
        shelves.some(
          shelf =>
            shelf.code === code
        );

      if(
        code &&
        !oldTestShelf &&
        !alreadyExists
      ){

        shelves.push({
          code:code,

          description:
            oldShelf.description ||
            "Shelf Location",

          orders:
            oldShelf.orders || []
        });

      }

    });

    save();

  }
  catch(error){

    shelves =
      REAL_SHELVES.map(
        shelf => ({
          ...shelf
        })
      );

  }

}

/* -----------------------------
   ASSIGN ORDER TO SHELF
----------------------------- */

function assignShelf(
  companyName,
  job,
  code,
  takePhoto
){

  code =
    normalizeCode(code);


  let shelf =
    shelves.find(
      shelf =>
        shelf.code === code
    );


  if(!shelf){

    alert(
      "Shelf " +
      code +
      " was not found."
    );

    return;

  }


  /*
    Remove this job from any
    previous shelf.
  */

  shelves.forEach(shelf => {

    shelf.orders =
      (
        shelf.orders || []
      )
      .filter(
        existingJob =>
          existingJob !== job
      );

  });


  /*
    Add the job to the new shelf.
  */

  if(
    !shelf.orders.includes(job)
  ){

    shelf.orders.push(job);

  }


  save();

  closeModal();


  if(takePhoto){

    shelfPhotoStep(
      companyName,
      job,
      code
    );

  }
  else{

    order(
      companyName,
      job
    );

  }

}

function sendOut(
  companyName,
  job
){

  let shelf =
    findShelf(job);


  /*
    Remove order from shelf.
  */

  shelves.forEach(shelf => {

    shelf.orders =
      (
        shelf.orders || []
      )
      .filter(
        existingJob =>
          existingJob !== job
      );

  });


  /*
    Remove from active company jobs.
  */

  if(companies[companyName]){

    companies[companyName] =
      companies[companyName]
      .filter(
        existingJob =>
          existingJob !== job
      );

  }


  /*
    Remove from team member's
    active order list.
  */

  Object
    .keys(teamOrders)
    .forEach(person => {

      teamOrders[person] =
        teamOrders[person]
        .filter(
          existingJob =>
            existingJob !== job
        );

    });


  /*
    Preserve history.
  */

  completedOrders.unshift({

    company:
      companyName,

    job:
      job,

    shelf:
      shelf
      ? shelf.code
      : "None",

    date:
      new Date()
      .toLocaleDateString()

  });


  save();


  modal(`

    <div class="center">

      <div style="font-size:60px">
        ✅
      </div>


      <h2>
        Order Sent Out!

      <p class="sub">

        has been moved to
        Completed Orders.

            " is now available."
          : ""
        }

      </p>


      <button
        class="btn purple"
        onclick="
          closeModal();
          completed()
        "
      >
        View Completed Orders
      </button>

    </div>

  `);

}

function saveShelf(){

  let code =
    normalizeCode(
      document
        .getElementById(
          "shelfCode"

        .value
    );


  let description =
    document
      .getElementById(
        "shelfDescription"
      )
      .value
      .trim();


  if(!code){

    alert(
      "Please enter a shelf code."
    );

    return;

  }


  if(
    shelves.some(
      shelf =>
        shelf.code === code
    )
  ){

    alert(
      "That shelf already exists."
    );

    return;

  }


  let photoInput =
    document.getElementById(
      "newShelfPhoto"
    );


  let file =
    photoInput.files[0];


  function finishSaving(){

    shelves.push({

      code:code,

      description:
        description ||
        "Shelf Location",

      orders:[]

    });


    save();

    shelfAdded(code);

  }


  if(file){

    let reader =
      new FileReader();


    reader.onload =
      function(){

        shelfPhotos[code] =
          reader.result;

        finishSaving();

      };


    reader.readAsDataURL(file);

  }
  else{

    finishSaving();

  }

}

/* -----------------------------

----------------------------- */

function normalizeCode(value){

  return String(
    value || ""
  )
  .trim()
  .toUpperCase()
  .replace(/\s+/g,"");

}


/*
  Stops the camera whenever
  the user leaves the scan screen.
*/

function stopScanner(){

  scanLocked = false;

  try{

    if(codeReader){
      codeReader.reset();
    }

  }
  catch(error){
    console.log(error);
  }


  let video =
    document.getElementById(
      "scannerVideo"
    );


  if(
    video &&
    video.srcObject
  ){

    video
      .srcObject
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    video.srcObject = null;

  }

}

/* -----------------------------
   START REAL CAMERA SCANNER
----------------------------- */

async function startBarcodeScanner(
  mode,
  companyName = "",
  job = ""
){

  scanLocked = false;


  let status =
    document.getElementById(
      "scanStatus"
    );


  /*
    Check that the ZXing barcode
    scanner loaded correctly.
  */

  if(
    typeof ZXing === "undefined"
  ){

    if(status){

      status.innerHTML =

        "The barcode scanner could not load. " +
        "You can still enter the barcode manually below.";

    }

    return;

  }


  try{

    codeReader =
      new ZXing
      .BrowserMultiFormatReader();


    /*
      Ask the iPad/iPhone for
      available cameras.
    */

    let videoDevices =
      await codeReader
      .listVideoInputDevices();


    let selectedDevice = null;


    /*
      Try to find the back camera.
    */

    for(
      let device of videoDevices
    ){

      let label =
        (
          device.label || ""
        )
        .toLowerCase();


      if(
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment")
      ){

        selectedDevice = device;

        break;

      }

    }


    /*
      If Safari doesn't label the
      cameras, use the last camera,
      which is commonly the rear
      camera on iPhone/iPad.
    */

    if(
      !selectedDevice &&
      videoDevices.length
    ){

      selectedDevice =
        videoDevices[
          videoDevices.length - 1
        ];

    }


    let deviceId =

      selectedDevice

      ? selectedDevice.deviceId

      : undefined;


    if(status){

      status.innerHTML =
        "Camera ready — scan a barcode.";

    }


    codeReader.decodeFromVideoDevice(

      deviceId,

      "scannerVideo",

      function(
        result,
        error
      ){

        if(
          result &&
          !scanLocked
        ){

          scanLocked = true;


          let barcode =
            result.getText();


          handleBarcode(

            barcode,

            mode,

            companyName,

            job

          );

        }

      }

    );

  }
  catch(error){

    console.log(error);


    if(status){

      status.innerHTML =

        "Camera could not start. " +
        "Make sure Safari has camera permission. " +
        "You can also enter the barcode manually below.";

    }

  }

}

----------------------------- */

function manualScan(
  mode,
  companyName,
  job
){

  let input =
    document.getElementById(
      "manualBarcode"
    );


  let value =
    input.value;


  if(!value){

    alert(
      "Enter the barcode or shelf code."
    );

    return;

  }


  handleBarcode(

    value,

    mode,

    companyName,

    job

  );

}


/* -----------------------------
   HANDLE SCANNED BARCODE
----------------------------- */

function handleBarcode(
  rawBarcode,
  mode,
  companyName,
  job
){

  stopScanner();


  let barcode =
    String(
      rawBarcode || ""
    )
    .trim();


  /*
    SHELF BARCODE
  */

  if(
    mode === "shelf" ||
    mode === "assign"
  ){

    let code =
      normalizeCode(barcode);


    let shelf =
      shelves.find(
        shelf =>
          shelf.code === code
      );


    if(!shelf){

      alert(

        "I scanned " +
        barcode +
        ", but it does not match a saved shelf."

      );


      if(mode === "assign"){

        scanShelfForOrder(
          companyName,
          job
        );

      }
      else{

        scanShelf();

      }


      return;

    }


    /*
      Assign shelf to an order.
    */

    if(mode === "assign"){

      assignShelf(

        companyName,

        job,

        code,

        true

      );

    }


    /*
      Or simply open the shelf.
    */

    else{

      viewShelf(code);

    }


    return;

  }


  /*
    PRODUCT BOX BARCODE
  */

  if(mode === "product"){

    boxMatch(barcode);

  }

}

    let month =
      String(
        today.getMonth() + 1
      )
      .padStart(
        2,
        "0"
      );


    let day =
      String(
        today.getDate()
      )
      .padStart(
        2,
        "0"
      );


    dateInput.value =
      year +
      "-" +
      month +
      "-" +
      day;

  }

}

  body.insertAdjacentHTML(

    `

      <tr>

        <td>
          <input
            type="number"
            min="0"
          >
        </td>

        <td>
          <input>
        </td>

      </tr>

    `

  );

}


/* -----------------------------
   SAVE NEW ORDER
----------------------------- */

function saveOrder(){

  let companyName =
    document
      .getElementById(
        "companyInput"
      )
      .value
      .trim();


  let job =
    document
      .getElementById(
        "jobInput"
      )
      .value
      .trim();


  if(
    !companyName ||
    !job
  ){

    alert(
      "Please enter the Company / Plumber and Job / Order."
    );

    return;

  }


  /*
    Create company if it
    doesn't already exist.
  */

  if(
    !companies[
      companyName
    ]
  ){

    companies[
      companyName
    ] = [];

  }


  /*
    Add job to company.
  */

  if(
    !companies[
      companyName
    ]
    .includes(job)
  ){

    companies[
      companyName
    ]
    .push(job);

  }


  /*
    For this prototype,
    newly created orders
    start under Mallerie.
  */

  if(
    !teamOrders.Mallerie
  ){

    teamOrders.Mallerie = [];

  }


  if(
    !teamOrders
      .Mallerie
      .includes(job)
  ){

    teamOrders
      .Mallerie
      .push(job);

  }


  save();


  order(
    companyName,
    job
  );

}
