<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plumbing Supply Manager</title>

<style>
:root{
  --purple:#7b4fe0;
  --light:#efe8ff;
  --bg:#f7f7fb;
  --card:#fff;
  --text:#17171c;
  --muted:#73737d;
  --line:#e5e5ec;
  --green:#2cac6d;
  --red:#d95353;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding-bottom:85px;
}
header{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  padding:15px;
  background:#fff;
  border-bottom:1px solid var(--line);
}
header h1{
  flex:1;
  margin:0;
  font-size:20px;
}
.icon{
  border:0;
  background:transparent;
  font-size:23px;
  padding:8px;
}
main{padding:15px}
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.home{
  min-height:110px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  cursor:pointer;
}
.home .emoji{font-size:28px}
.home.create{
  background:var(--purple);
  color:#fff;
}
.search,input,select,textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:13px;
  padding:12px;
  background:#fff;
  font:inherit;
}
.search{margin-bottom:14px}
label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:12px 0 6px;
}
textarea{min-height:90px}
.row{
  display:flex;
  align-items:center;
  gap:12px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px;
  margin-bottom:10px;
  cursor:pointer;
}
.row-main{flex:1}
.title{font-weight:800}
.sub{
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}
.badge{
  font-size:12px;
  font-weight:700;
  padding:6px 9px;
  border-radius:999px;
}
.available{
  background:#e5f8ee;
  color:#16814c;
}
.used{
  background:var(--light);
  color:#6039c7;
}
.btn{
  width:100%;
  border:0;
  border-radius:13px;
  padding:13px;
  font-weight:800;
  margin-top:10px;
  cursor:pointer;
}
.purple{
  background:var(--purple);
  color:#fff;
}
.soft{
  background:var(--light);
  color:#6039c7;
}
.gray{
  background:#ededf2;
  color:#222;
}
.red{
  background:var(--red);
  color:#fff;
}
.small{
  width:auto;
  padding:9px 12px;
  margin:0;
}
.heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}
.heading h2{margin:0}
.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  background:#fff;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  padding:8px;
}
.nav{
  border:0;
  background:transparent;
  font-size:11px;
}
.nav span{
  display:block;
  font-size:20px;
}
.drawer{
  display:none;
  position:fixed;
  inset:0;
  z-index:50;
}
.drawer.open{display:block}
.shade{
  position:absolute;
  inset:0;
  background:#0006;
}
.menu{
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  width:82%;
  max-width:340px;
  background:#fff;
  padding:22px 15px;
}
.menu h2{margin-top:10px}
.menu div{
  padding:14px;
  border-radius:12px;
  cursor:pointer;
}
.menu div:hover{background:var(--light)}
.qr{
  width:155px;
  height:155px;
  margin:18px auto;
  border:10px solid white;
  box-shadow:0 0 0 2px #ddd;
  background:
  repeating-linear-gradient(45deg,#111 0 10px,#fff 10px 20px),
  repeating-linear-gradient(-45deg,#111 0 10px,#fff 10px 20px);
}
.qrcode{
  font-size:34px;
  font-weight:900;
  text-align:center;
}
.center{text-align:center}
.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal.open{display:flex}
.modal-bg{
  position:absolute;
  inset:0;
  background:#0007;
}
.modal-card{
  position:relative;
  background:#fff;
  border-radius:22px;
  padding:20px;
  width:100%;
  max-width:420px;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:8px 4px;
  border-bottom:1px solid var(--line);
}
td input{
  border:0;
  padding:7px;
}
.scan{
  height:330px;
  border-radius:20px;
  background:#222;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}
.frame{
  width:175px;
  height:175px;
  border:4px solid #a77cff;
  border-radius:20px;
}
</style>
</head>

<body>

<div class="app">

<header>
<button class="icon" onclick="menuOpen()">☰</button>
<h1 id="pageTitle">Plumbing Supply Manager</h1>
<button class="icon">🔔</button>
</header>

<main id="main"></main>

</div>

<div class="bottom">
<button class="nav" onclick="home()"><span>⌂</span>Home</button>
<button class="nav" onclick="orders()"><span>📦</span>My Orders</button>
<button class="nav" onclick="scan()"><span>◎</span>Scan</button>
<button class="nav" onclick="reminders()"><span>🔔</span>Reminders</button>
<button class="nav" onclick="menuOpen()"><span>☰</span>More</button>
</div>

<div id="drawer" class="drawer">
<div class="shade" onclick="menuClose()"></div>
<div class="menu">

<h2>Plumbing Supply Manager</h2>

<div onclick="home();menuClose()">⌂ Home</div>
<div onclick="orders();menuClose()">📦 My Orders</div>
<div onclick="quotes();menuClose()">📄 Quotes</div>
<div onclick="customers();menuClose()">👥 Customers</div>
<div onclick="createOrder();menuClose()">＋ Create Order</div>
<div onclick="invoices();menuClose()">🧾 Invoices</div>
<div onclick="reminders();menuClose()">🔔 Reminders</div>

<div onclick="shelfLocations();menuClose()"
style="background:#efe8ff;color:#6039c7">
▦ Shelf Locations
</div>

<div onclick="completed();menuClose()">✅ Completed Orders</div>

</div>
</div>

<div id="modal" class="modal">
<div class="modal-bg" onclick="closeModal()"></div>
<div id="modalCard" class="modal-card"></div>
</div>

<script>

let shelves=[
 {code:"A1",description:"Front Wall - Top Shelf",orders:[]},
 {code:"A2",description:"Front Wall - Middle Shelf",orders:[]},
 {code:"A3",description:"Front Wall - Bottom Shelf",orders:[]},
 {code:"B1",description:"Back Wall - Top Shelf",orders:[]},
 {code:"B2",description:"Back Wall - Middle Shelf",orders:[]},
 {code:"B3",description:"Back Wall - Bottom Shelf",orders:[]}
];

let companies={
 "D Star Plumbing":["306 Preserve","Cross Roads","K Knutson","Johnson"],
 "Ridgeline Plumbing":["Highland"],
 "Durant / Slate":["Harvest Fields"],
 "Goff Plumbing":["309 Stalker Farms"],
 "Cable Plumbing":[]
};

let homeowners=["Ryan","Johnson Residence","Rebecca","John"];

let completedOrders=[];

function title(t){
 document.getElementById("pageTitle").textContent=t;
}

function content(h){
 document.getElementById("main").innerHTML=h;
 window.scrollTo(0,0);
}

function menuOpen(){
 document.getElementById("drawer").classList.add("open");
}

function menuClose(){
 document.getElementById("drawer").classList.remove("open");
}

function modal(h){
 document.getElementById("modalCard").innerHTML=h;
 document.getElementById("modal").classList.add("open");
}

function closeModal(){
 document.getElementById("modal").classList.remove("open");
}

function save(){
 localStorage.setItem("shelves",JSON.stringify(shelves));
 localStorage.setItem("companies",JSON.stringify(companies));
 localStorage.setItem("completed",JSON.stringify(completedOrders));
}

function load(){
 if(localStorage.shelves) shelves=JSON.parse(localStorage.shelves);
 if(localStorage.companies) companies=JSON.parse(localStorage.companies);
 if(localStorage.completed) completedOrders=JSON.parse(localStorage.completed);
}

function home(){

 title("Plumbing Supply Manager");

 content(`
 <input class="search" placeholder="Search anything...">

 <div class="grid">

 <div class="card home" onclick="orders()">
 <div class="emoji">📦</div>
 <strong>My Orders</strong>
 </div>

 <div class="card home" onclick="quotes()">
 <div class="emoji">📄</div>
 <strong>Quotes</strong>
 </div>

 <div class="card home" onclick="customers()">
 <div class="emoji">👥</div>
 <strong>Customers</strong>
 </div>

 <div class="card home create" onclick="createOrder()">
 <div class="emoji">＋</div>
 <strong>Create Order</strong>
 </div>

 <div class="card home" onclick="invoices()">
 <div class="emoji">🧾</div>
 <strong>Invoices</strong>
 </div>

 <div class="card home" onclick="reminders()">
 <div class="emoji">🔔</div>
 <strong>Reminders</strong>
 </div>

 </div>
 `);
}

function orders(){

 title("My Orders");

 content(`
 <div class="row" onclick="contractors()">
 <div style="font-size:28px">🔧</div>
 <div class="row-main">
 <div class="title">Plumbers / Contractors</div>
 <div class="sub">Companies and jobs</div>
 </div>
 <div>›</div>
 </div>

 <div class="row" onclick="homeownerList()">
 <div style="font-size:28px">🏠</div>
 <div class="row-main">
 <div class="title">Homeowners</div>
 <div class="sub">Individual orders</div>
 </div>
 <div>›</div>
 </div>
 `);
}

function contractors(){

 title("Plumbers / Contractors");

 let html=`<input class="search" placeholder="Search companies...">`;

 Object.keys(companies).forEach(c=>{

 html+=`
 <div class="row" onclick="company('${c}')">
 <div class="row-main">
 <div class="title">${c}</div>
 <div class="sub">${companies[c].length} active jobs</div>
 </div>
 <div>›</div>
 </div>
 `;

 });

 content(html);
}

function company(c){

 title(c);

 let html=`
 <button class="btn gray small" onclick="contractors()">‹ Companies</button>
 <h2>Jobs / Orders</h2>
 `;

 companies[c].forEach(j=>{

 let shelf=findShelf(j);

 html+=`
 <div class="row" onclick="order('${c}','${j}')">
 <div class="row-main">
 <div class="title">${j}</div>
 <div class="sub">${shelf ? "Shelf "+shelf.code : "No shelf assigned"}</div>
 </div>
 <div>›</div>
 </div>
 `;

 });

 content(html);
}

function homeownerList(){

 title("Homeowners");

 let html=`<input class="search" placeholder="Search homeowners...">`;

 homeowners.forEach(h=>{

 html+=`
 <div class="row">
 <div class="row-main">
 <div class="title">${h}</div>
 <div class="sub">Homeowner</div>
 </div>
 <div>›</div>
 </div>
 `;

 });

 content(html);
}

function findShelf(job){
 return shelves.find(s=>s.orders.includes(job));
}

function order(c,j){

 title("Order Details");

 let shelf=findShelf(j);

 content(`

 <button class="btn gray small" onclick="company('${c}')">
 ‹ ${c}
 </button>

 <div class="card">

 <h2>${j}</h2>
 <div class="sub">${c}</div>

 <br>

 <div class="card">
 <div class="sub">Shelf Location</div>
 <div class="title">
 ${shelf ? "▦ "+shelf.code : "Not Assigned"}
 </div>
 ${shelf ? `<div class="sub">${shelf.description}</div>` : ""}
 </div>

 <div class="row">
 <div class="row-main">
 <div class="title">Items</div>
 <div class="sub">View received and missing items</div>
 </div>
 <div>›</div>
 </div>

 <div class="row">
 <div class="row-main">
 <div class="title">Notes</div>
 </div>
 <div>›</div>
 </div>

 <div class="row">
 <div class="row-main">
 <div class="title">Shelf Photo</div>
 <div class="sub">Photo of all boxes together</div>
 </div>
 <div>›</div>
 </div>

 <div class="row">
 <div class="row-main">
 <div class="title">Invoices</div>
 </div>
 <div>›</div>
 </div>

 <button class="btn soft"
 onclick="chooseShelf('${c}','${j}')">
 ${shelf ? "Move to Another Shelf" : "Assign Shelf"}
 </button>

 <button class="btn purple"
 onclick="sendConfirm('${c}','${j}')">
 Send Out Order
 </button>

 </div>
 `);
}

function chooseShelf(c,j){

 let h=`
 <h2>Assign Shelf</h2>

 <button class="btn purple"
 onclick="closeModal();scanShelfForOrder('${c}','${j}')">
 Scan Shelf QR
 </button>

 <p class="sub">Or choose a shelf:</p>
 `;

 shelves.forEach(s=>{

 h+=`
 <div class="row"
 onclick="assignShelf('${c}','${j}','${s.code}')">

 <div class="row-main">
 <div class="title">${s.code}</div>
 <div class="sub">${s.description}</div>
 </div>

 <span class="badge ${s.orders.length?"used":"available"}">
 ${s.orders.length ? s.orders.length+" Order" : "Available"}
 </span>

 </div>
 `;

 });

 h+=`<button class="btn gray" onclick="closeModal()">Cancel</button>`;

 modal(h);
}

function assignShelf(c,j,code){

 shelves.forEach(s=>{
   s.orders=s.orders.filter(x=>x!==j);
 });

 let shelf=shelves.find(s=>s.code===code);

 if(shelf) shelf.orders.push(j);

 save();

 closeModal();

 order(c,j);
}

function sendConfirm(c,j){

 let shelf=findShelf(j);

 modal(`

 <h2>Send Out Order</h2>

 <p>
 Has <strong>${j}</strong> left the showroom?
 </p>

 <p class="sub">
 This will remove the job from
 ${shelf ? "Shelf "+shelf.code : "its shelf location"}
 and move it into Completed Orders.
 </p>

 <button class="btn purple"
 onclick="sendOut('${c}','${j}')">
 Yes, Send Out Order
 </button>

 <button class="btn gray" onclick="closeModal()">
 Cancel
 </button>

 `);
}

function sendOut(c,j){

 let shelf=findShelf(j);

 shelves.forEach(s=>{
   s.orders=s.orders.filter(x=>x!==j);
 });

 companies[c]=companies[c].filter(x=>x!==j);

 completedOrders.unshift({
   company:c,
   job:j,
   shelf:shelf?shelf.code:"None",
   date:new Date().toLocaleDateString()
 });

 save();

 modal(`

 <div class="center">

 <div style="font-size:60px">✅</div>

 <h2>Order Sent Out!</h2>

 <p class="sub">
 ${j} has been removed from
 ${shelf ? "Shelf "+shelf.code : "the active orders"}
 and moved to Completed Orders.
 </p>

 <button class="btn purple"
 onclick="closeModal();completed()">
 View Completed Orders
 </button>

 </div>

 `);
}

function shelfLocations(){

 title("Shelf Locations");

 let h=`

 <div class="heading">

 <h2>All Shelves</h2>

 <button class="btn purple small"
 onclick="addShelf()">
 + Add Shelf
 </button>

 </div>

 <input class="search" placeholder="Search shelves...">
 `;

 shelves.forEach(s=>{

 h+=`
 <div class="row" onclick="viewShelf('${s.code}')">

 <div style="font-size:24px">▦</div>

 <div class="row-main">
 <div class="title">${s.code}</div>
 <div class="sub">${s.description}</div>
 </div>

 <span class="badge ${s.orders.length?"used":"available"}">

 ${
 s.orders.length
 ? s.orders.length+(s.orders.length===1?" Order":" Orders")
 : "Available"
 }

 </span>

 </div>
 `;

 });

 content(h);
}

function addShelf(){

 title("Add Shelf");

 content(`

 <button class="btn gray small"
 onclick="shelfLocations()">
 ‹ Shelf Locations
 </button>

 <div class="card">

 <label>Shelf Code *</label>

 <input id="shelfCode"
 placeholder="Example: D4">

 <label>Description</label>

 <input id="shelfDescription"
 placeholder="Example: Back Wall - Lower Shelf">

 <label>Shelf Photo</label>

 <button class="btn soft">
 📷 Add Shelf Photo
 </button>

 <button class="btn purple"
 onclick="saveShelf()">
 Save Shelf
 </button>

 </div>

 `);
}

function saveShelf(){

 let code=document
 .getElementById("shelfCode")
 .value.trim().toUpperCase();

 let description=document
 .getElementById("shelfDescription")
 .value.trim();

 if(!code){
   alert("Please enter a shelf code.");
   return;
 }

 if(shelves.find(s=>s.code===code)){
   alert("That shelf already exists.");
   return;
 }

 shelves.push({
   code:code,
   description:description||"Shelf Location",
   orders:[]
 });

 save();

 shelfAdded(code);
}

function shelfAdded(code){

 let shelf=shelves.find(s=>s.code===code);

 title("Shelf Added");

 content(`

 <div class="card center">

 <div style="font-size:60px">✅</div>

 <h2>Shelf ${code} Added!</h2>

 <p class="sub">${shelf.description}</p>

 <div class="qr"></div>

 <div class="qrcode">${code}</div>

 <p class="sub">
 This QR belongs permanently to Shelf ${code}.
 </p>

 <button class="btn purple"
 onclick="viewShelf('${code}')">
 View Shelf
 </button>

 <button class="btn soft"
 onclick="addShelf()">
 Add Another Shelf
 </button>

 </div>

 `);
}

function viewShelf(code){

 let shelf=shelves.find(s=>s.code===code);

 title("Shelf Details");

 let ordersHTML="";

 if(shelf.orders.length===0){

 ordersHTML=`
 <div class="card center">
 <div style="font-size:42px">📭</div>
 <h3>No orders on this shelf</h3>
 <p class="sub">Shelf ${code} is available.</p>
 </div>
 `;

 }else{

 shelf.orders.forEach(j=>{

 let c=Object.keys(companies)
 .find(x=>companies[x].includes(j))||"";

 ordersHTML+=`
 <div class="row" onclick="order('${c}','${j}')">
 <div class="row-main">
 <div class="title">${j}</div>
 <div class="sub">${c}</div>
 </div>
 <div>›</div>
 </div>
 `;

 });

 }

 content(`

 <button class="btn gray small"
 onclick="shelfLocations()">
 ‹ Shelf Locations
 </button>

 <div class="card center">

 <div class="qr"></div>

 <div class="qrcode">${shelf.code}</div>

 <strong>${shelf.description}</strong>

 <br><br>

 <span class="badge ${shelf.orders.length?"used":"available"}">

 ${
 shelf.orders.length
 ? shelf.orders.length+" Order"
 : "Available"
 }

 </span>

 <button class="btn purple"
 onclick="scanShelf()">
 Scan Shelf
 </button>

 </div>

 <h2>Orders on This Shelf</h2>

 ${ordersHTML}

 `);
}

function scan(){

 title("Scan");

 content(`

 <div class="scan">

 <div class="frame"></div>

 <h2>Camera</h2>

 <p>Scan or take a photo</p>

 </div>

 <button class="btn purple"
 onclick="scanChoices()">
 TEST SCAN
 </button>

 `);
}

function scanChoices(){

 title("What is this?");

 content(`

 <div class="grid">

 <div class="card home" onclick="boxScan()">
 <div class="emoji">📦</div>
 <strong>Box Scan</strong>
 </div>

 <div class="card home" onclick="invoices()">
 <div class="emoji">🧾</div>
 <strong>Invoice Scan</strong>
 </div>

 <div class="card home" onclick="quotes()">
 <div class="emoji">📄</div>
 <strong>Quote Scan</strong>
 </div>

 <div class="card home" onclick="scanShelf()">
 <div class="emoji">▦</div>
 <strong>Location Scan</strong>
 </div>

 </div>

 `);
}

function boxScan(){

 title("Box Scan");

 content(`

 <div class="card">

 <h2>Scan the Box</h2>

 <p class="sub">
 Scan the actual product box or item label.
 </p>

 <label>Company / Plumber</label>

 <select>
 <option>D Star Plumbing</option>
 <option>Ridgeline Plumbing</option>
 </select>

 <label>Job / Order</label>

 <select>
 <option>306 Preserve</option>
 <option>Cross Roads</option>
 </select>

 <label>Item</label>
 <input value="Shower Trim">

 <label>Quantity</label>
 <input type="number" value="1">

 <button class="btn purple"
 onclick="scanShelfForOrder('D Star Plumbing','306 Preserve')">
 Next: Scan Shelf QR
 </button>

 </div>

 `);
}

function scanShelfForOrder(c,j){

 title("Scan Shelf to Assign");

 content(`

 <div class="scan">

 <div class="frame"></div>

 <h2>Scan Shelf QR</h2>

 <p>
 Position the shelf QR code in the frame.
 </p>

 </div>

 <button class="btn purple"
 onclick="assignShelf('${c}','${j}','A1')">
 TEST SCAN A1
 </button>

 `);
}

function scanShelf(){

 title("Scan Shelf");

 content(`

 <div class="scan">

 <div class="frame"></div>

 <h2>Scan Shelf QR Code</h2>

 <p>Position the QR code in the frame.</p>

 </div>

 <button class="btn purple"
 onclick="viewShelf('A1')">
 TEST SCAN A1
 </button>

 `);
}

function completed(){

 title("Completed Orders");

 let h=`<input class="search" placeholder="Search completed orders...">`;

 if(completedOrders.length===0){

 h+=`
 <div class="card center">
 <div style="font-size:45px">📦</div>
 <h3>No completed orders yet</h3>
 </div>
 `;

 }else{

 completedOrders.forEach(o=>{

 h+=`
 <div class="row">

 <div>✅</div>

 <div class="row-main">

 <div class="title">${o.job}</div>

 <div class="sub">${o.company}</div>

 <div class="sub">
 Previous Shelf: ${o.shelf} • ${o.date}
 </div>

 </div>

 </div>
 `;

 });

 }

 content(h);
}

function quotes(){

 title("Quotes");

 content(`

 <div class="heading">
 <h2>Quotes</h2>
 <button class="btn purple small">+ Add / Scan Quote</button>
 </div>

 <input class="search"
 placeholder="Search company or job...">

 <div class="row">
 <div class="row-main">
 <div class="title">D Star Plumbing</div>
 <div class="sub">306 Preserve • Quote</div>
 </div>

function saveOrder(){

 let c=document.getElementById("companyInput").value.trim();
 let j=document.getElementById("jobInput").value.trim();

 if(!c||!j){
   alert("Please enter the Company and Job.");
   return;
 }

 if(!companies[c]) companies[c]=[];

 companies[c].push(j);

 save();

 order(c,j);
}
